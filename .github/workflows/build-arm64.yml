name: Build TRI-PI ARM64

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "triangles_v5 tag to build (example: v5.9.11). Leave empty to use latest upstream release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-arm64:
    # Native ARM64 runner (free for public repos). No QEMU emulation — the old
    # emulated build was slow and got OOM-killed mid-compile.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout tri-pi repo
        uses: actions/checkout@v4

      - name: Resolve target triangles version
        id: get-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          elif [ -n "${{ github.event.inputs.version || '' }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL https://api.github.com/repos/SamiAhmed7777/triangles_v5/releases/latest | jq -r .tag_name)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to resolve triangles_v5 release version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building triangles $VERSION natively for ARM64"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git build-essential cmake ninja-build libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev zlib1g-dev bsdmainutils libboost-all-dev \
            libminiupnpc-dev libzmq3-dev curl wget ca-certificates jq autoconf liblzma-dev libzstd-dev \
            librocksdb-dev libsnappy-dev libbz2-dev libdb++-dev

      - name: Build triangles_v5 (native ARM64)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          exec > >(tee artifacts/build-arm64.log) 2>&1
          VERSION="${{ steps.get-version.outputs.version }}"

          # Tor's --with-*-dir=/usr hardcodes /usr/lib/<lib>.a and is not
          # multiarch-aware; symlink the aarch64 static libs where it looks.
          MA=/usr/lib/aarch64-linux-gnu
          for L in libz libssl libcrypto libevent libevent_core libevent_extra libevent_pthreads liblzma libzstd; do
            if [ -f "$MA/$L.a" ]; then sudo ln -sf "$MA/$L.a" "/usr/lib/$L.a"; fi
          done

          cd "$RUNNER_TEMP"
          rm -rf triangles_v5
          git clone --branch "$VERSION" --depth 1 https://github.com/SamiAhmed7777/triangles_v5.git
          cd triangles_v5

          # Submodules: embedded Tor + libsecp256k1 (hard dep since the v5.9 ECDSA migration).
          git submodule update --init --recursive src/tor/tor-src
          git submodule update --init --recursive src/secp256k1 || git submodule update --init src/secp256k1
          test -f src/secp256k1/CMakeLists.txt
          test -d src/tor/tor-src

          # Embedded Tor (native — no cross/sysroot flags).
          export LDFLAGS="-L/usr/lib/aarch64-linux-gnu"
          cd src/tor/tor-src
          ./autogen.sh
          ./configure \
            --enable-static-tor \
            --disable-module-relay --disable-module-dirauth \
            --disable-asciidoc --disable-manpage --disable-html-manual \
            --disable-unittests --disable-tool-name-check \
            --with-openssl-dir=/usr --with-libevent-dir=/usr --with-zlib-dir=/usr \
            --prefix=/usr/local
          make -j"$(nproc)"

          cd "$RUNNER_TEMP/triangles_v5"
          rm -rf build && mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT=OFF -DBUILD_DAEMON=ON -DBUILD_TESTS=OFF \
            -DUSE_UPNP=ON -DUSE_TOR_EMBEDDED=ON \
            -DTOR_SOURCE_ROOT="$RUNNER_TEMP/triangles_v5/src/tor/tor-src"
          cmake --build . --target trianglesd

          BIN="$RUNNER_TEMP/triangles_v5/build/bin/trianglesd"
          strip "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cp "$BIN" "$GITHUB_WORKSPACE/bin/trianglesd"
          chmod +x "$GITHUB_WORKSPACE/bin/trianglesd"
          file "$GITHUB_WORKSPACE/bin/trianglesd" | tee "$GITHUB_WORKSPACE/artifacts/trianglesd-file.txt"

      - name: Update VERSION file
        run: echo "${{ steps.get-version.outputs.version }}" > VERSION

      - name: Create release package
        run: |
          set -euo pipefail
          VERSION="${{ steps.get-version.outputs.version }}"
          PACKAGE_DIR="tri-pi-${VERSION}-arm64"
          mkdir -p releases
          tar czf "releases/${PACKAGE_DIR}.tar.gz" bin/ docs/ install.sh README.md VERSION BOOTSTRAP.md 2>/dev/null || \
            tar czf "releases/${PACKAGE_DIR}.tar.gz" bin/ install.sh README.md VERSION
          cd releases
          sha256sum "${PACKAGE_DIR}.tar.gz" > "${PACKAGE_DIR}.tar.gz.sha256"
          ls -lh "${PACKAGE_DIR}.tar.gz"*

      - name: Commit and push changes
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          git config user.name "TRI-PI Builder"
          git config user.email "bot@tri-pi.build"
          git add VERSION bin/trianglesd releases/ || true
          git commit -m "Auto-build: TRI-PI ${VERSION} ARM64 (native runner)" || echo "No changes to commit"
          git push origin main || echo "Already up to date"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tri-pi-arm64-build-diagnostics-${{ steps.get-version.outputs.version }}
          path: artifacts/
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: TRI-PI ${{ steps.get-version.outputs.version }} ARM64
          body: |
            # TRI-PI ${{ steps.get-version.outputs.version }} ARM64

            Native ARM64 release built from [triangles_v5 ${{ steps.get-version.outputs.version }}](https://github.com/SamiAhmed7777/triangles_v5/releases/tag/${{ steps.get-version.outputs.version }}) on a native ARM64 runner.

            ## Installation

            ```bash
            wget https://github.com/SamiAhmed7777/tri-pi/releases/download/${{ steps.get-version.outputs.version }}/tri-pi-${{ steps.get-version.outputs.version }}-arm64.tar.gz
            tar xzf tri-pi-${{ steps.get-version.outputs.version }}-arm64.tar.gz
            cd tri-pi-*/
            sudo ./install.sh
            ```

            ## What's Included
            - Native ARM64 trianglesd binary (v5.9.x with the chain-recovery fixes + embedded Tor)
            - One-command installer
            - Updated seed nodes

            Built for: Raspberry Pi 4/5 (64-bit) and ARM64 servers (Ampere, AWS Graviton, Hetzner CAX, etc.)
          files: |
            releases/tri-pi-${{ steps.get-version.outputs.version }}-arm64.tar.gz
            releases/tri-pi-${{ steps.get-version.outputs.version }}-arm64.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
