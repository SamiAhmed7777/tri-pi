# Build TRI-PI ARM64 — TRI7 era
#
# Builds tri7d (the modern Rust client, from github.com/SamiAhmed7777/tri7)
# NATIVELY on an ARM64 GitHub runner — no QEMU, no cross toolchain, and none
# of the legacy C++ dependency mountain (boost/libevent/libdb++ are gone;
# tri7 needs only a Rust toolchain + gcc for the vendored C hash code).
#
# Triggers:
#   - repository_dispatch `new-release` (from tri7's release automation)
#   - workflow_dispatch (manual; optional tri7 tag input)

name: Build TRI-PI ARM64 (tri7d)

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "tri7 tag to build (example: v0.1.0). Leave empty to use tri7 master."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-arm64:
    # Native ARM64 runner (free for public repos). No QEMU emulation.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout tri-pi repo
        uses: actions/checkout@v4

      - name: Resolve tri7 ref
        id: get-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          elif [ -n "${{ github.event.inputs.version || '' }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            # Latest tri7 release; fall back to master when none exists yet.
            VERSION=$(curl -fsSL https://api.github.com/repos/SamiAhmed7777/tri7/releases/latest | jq -r .tag_name || true)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="master"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building tri7 ($VERSION) natively for ARM64"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          # Rust + gcc: tri7 is pure Rust with vendored C hash code (cc crate).
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl ca-certificates jq build-essential git
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build tri7d (native ARM64)
        run: |
          set -euo pipefail
          mkdir -p artifacts bin
          exec > >(tee artifacts/build-arm64.log) 2>&1
          REF="${{ steps.get-version.outputs.version }}"

          cd "$RUNNER_TEMP"
          rm -rf tri7
          git clone --branch "$REF" --depth 1 https://github.com/SamiAhmed7777/tri7.git || \
            git clone --depth 1 https://github.com/SamiAhmed7777/tri7.git
          cd tri7
          cargo build --release --bin follow_tip --bin balances

          # follow_tip IS tri7d. Headless build — the GUI wallet
          # (tri7_wallet_gui, --features gui) is not shipped on the Pi.
          BIN="$RUNNER_TEMP/tri7/target/release/follow_tip"
          BAL="$RUNNER_TEMP/tri7/target/release/balances"
          strip "$BIN" "$BAL"
          cp "$BIN" "$GITHUB_WORKSPACE/bin/tri7d"
          cp "$BAL" "$GITHUB_WORKSPACE/bin/tri7-balances"
          chmod +x "$GITHUB_WORKSPACE/bin/"*
          file "$GITHUB_WORKSPACE/bin/tri7d" | tee "$GITHUB_WORKSPACE/artifacts/tri7d-file.txt"

      - name: Run tri-pi binary tests
        run: ./tests/test_binary.sh || true

      - name: Update VERSION file
        run: echo "${{ steps.get-version.outputs.version }}-tri7.1" > VERSION

      - name: Create release package
        run: |
          set -euo pipefail
          VERSION="${{ steps.get-version.outputs.version }}-tri7.1"
          PACKAGE_DIR="tri-pi-${VERSION}-arm64"
          mkdir -p releases
          tar czf "releases/${PACKAGE_DIR}.tar.gz" \
            bin/ install.sh upgrade.sh tri-pi-doctor.sh lib/ README.md VERSION BOOTSTRAP.md || \
            tar czf "releases/${PACKAGE_DIR}.tar.gz" bin/ install.sh README.md VERSION
          cd releases
          sha256sum "${PACKAGE_DIR}.tar.gz" > "${PACKAGE_DIR}.tar.gz.sha256"
          ls -lh "${PACKAGE_DIR}.tar.gz"*

      - name: Commit and push changes
        run: |
          VERSION="${{ steps.get-version.outputs.version }}-tri7.1"
          git config user.name "TRI-PI Builder"
          git config user.email "bot@tri-pi.build"
          git add VERSION bin/tri7d bin/tri7-balances releases/ || true
          git commit -m "Auto-build: TRI-PI ${VERSION} ARM64 (tri7d)" || echo "No changes to commit"
          git push origin main || echo "Already up to date"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tri-pi-arm64-build-diagnostics-${{ steps.get-version.outputs.version }}
          path: artifacts/
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get-version.outputs.version }}-tri7.1
          name: TRI-PI ${{ steps.get-version.outputs.version }}-tri7.1 ARM64
          body: |
            # TRI-PI ${{ steps.get-version.outputs.version }}-tri7.1 ARM64 — tri7d

            Built from [tri7 ${{ steps.get-version.outputs.version }}](https://github.com/SamiAhmed7777/tri7) on a native ARM64 runner.

            Ships **tri7d** (the modern Rust full-node daemon, `follow_tip`) — the legacy
            C++ `trianglesd` is retired; its artifacts remain under `legacy/` for rollback.

            - Native JSON-RPC on **19112**, inbound P2P on **24113**, tor SOCKS **9050**
            - Tor integration preserved: tri7d dials `.onion` seeds through the Pi's tor service
            - Fresh sync via P2P gap-fill (no legacy bootstrap tarball)

            ## Installation

            ```bash
            wget https://github.com/SamiAhmed7777/tri-pi/releases/download/${{ steps.get-version.outputs.version }}-tri7.1/tri-pi-${{ steps.get-version.outputs.version }}-tri7.1-arm64.tar.gz
            tar xzf tri-pi-*-arm64.tar.gz
            cd tri-pi-*/
            sudo ./install.sh
            ```
          files: |
            releases/tri-pi-${{ steps.get-version.outputs.version }}-tri7.1-arm64.tar.gz
            releases/tri-pi-${{ steps.get-version.outputs.version }}-tri7.1-arm64.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
